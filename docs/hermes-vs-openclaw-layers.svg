<svg width="680" height="370" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hermes vs OpenClaw architecture layers</title>
<desc>Hermes profiles sit in the instruction-set layer and are host-agnostic. They can be executed by either the local host agent worker (today) or the OpenClaw hosted runner worker (later), each of which reads/writes its own state layer: local .autoclaw for the local worker, hosted Postgres for OpenClaw once state migrates.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="190" y="30" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Hermes profile</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">instruction set, host-agnostic</text>

<line x1="340" y1="86" x2="190" y2="150" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="470" y2="150" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="60" y="150" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="170" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Local host agent</text>
<text x="190" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">worker, today</text>

<rect x="340" y="150" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="470" y="170" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">OpenClaw hosted runner</text>
<text x="470" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">worker, later</text>

<line x1="190" y1="206" x2="190" y2="270" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="470" y1="206" x2="470" y2="270" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="60" y="270" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Local .autoclaw state</text>
<text x="190" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">vector, KG, MEMORY.md</text>

<rect x="340" y="270" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="470" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Hosted Postgres</text>
<text x="470" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">vector + KG migrate here</text>

</svg>
