---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.categories %} · {{ page.categories | join: ", " }}{% endif %}
    </p>
  </header>
  {{ content }}
</article>
<p><a href="{{ '/' | relative_url }}">← Index</a></p>
